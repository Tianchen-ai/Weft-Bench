[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weft-bench"
version = "0.3.0"
description = "Compare Weft kernels with GGML and parameter-selected llama.cpp replacements"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.urls]
Source = "https://github.com/Tianchen-ai/Weft-Bench"
Issues = "https://github.com/Tianchen-ai/Weft-Bench/issues"
Weft = "https://github.com/Tianchen-ai/Weft"

[project.scripts]
weft-bench = "weft_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weft_bench = ["native/**/*.h", "native/**/*.cpp", "native/**/*.c", "operators/*.json"]
